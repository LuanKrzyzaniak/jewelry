<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Joalheria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --onyx:#1b1920; --gold:#c9a227; --gold-dark:#ad8a1f; }
    body { background-color: var(--onyx); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { border: none; border-radius: 12px; }
    .btn-warning {
      --bs-btn-bg: var(--gold);            --bs-btn-border-color: var(--gold);
      --bs-btn-hover-bg: var(--gold-dark);  --bs-btn-hover-border-color: var(--gold-dark);
      --bs-btn-active-bg: var(--gold-dark); --bs-btn-active-border-color: var(--gold-dark);
      --bs-btn-color: var(--onyx);          --bs-btn-hover-color: var(--onyx);
      --bs-btn-active-color: var(--onyx);
    }
    .text-warning { color: var(--gold) !important; }
  </style>
</head>
<body>
<div class="card shadow" style="width: 360px;">
  <div class="card-body p-5">
    <div class="text-center mb-4">
      <i class="bi bi-gem fs-1 text-warning"></i>
      <h5 class="mt-2 fw-bold">DJK Joias</h5>
    </div>

    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
      <div class="alert alert-danger py-2 small">Usuário ou senha incorretos.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label small fw-semibold">Usuário</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Senha</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-warning w-100 fw-semibold">Entrar</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
