<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erro interno — DJK Joias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1a1a2e;
      color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .erro-icon { font-size: 4rem; color: #dc3545; }
    .erro-code { font-size: 5rem; font-weight: 700; letter-spacing: .05em; }
    .erro-msg { color: #adb5bd; }
    .btn-warning { color: #1a1a2e; font-weight: 600; border-radius: .45rem; }
  </style>
</head>
<body>
  <div class="px-3">
    <div class="erro-icon mb-3"><i class="bi bi-exclamation-triangle-fill"></i></div>
    <div class="erro-code">500</div>
    <p class="fs-5 mb-1">Erro interno do servidor</p>
    <p class="erro-msg mb-4">Algo deu errado do nosso lado. A equipe já foi notificada.</p>
    <a href="/" class="btn btn-warning px-4">
      <i class="bi bi-house-door me-2"></i>Voltar ao início
    </a>
  </div>
</body>
</html>
