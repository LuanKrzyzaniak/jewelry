<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — DJK Joias</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1b1920;
      color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .erro-icon { font-size: 4rem; color: #c9a227; }
    .erro-code { font-size: 5rem; font-weight: 700; letter-spacing: .05em; }
    .erro-msg { color: #b7b2a6; }
    .btn-warning {
      background-color: #c9a227; border-color: #c9a227;
      color: #1b1920; font-weight: 600; border-radius: .45rem;
    }
    .btn-warning:hover { background-color: #ad8a1f; border-color: #ad8a1f; color: #1b1920; }
  </style>
</head>
<body>
  <div class="px-3">
    <div class="erro-icon mb-3"><i class="bi bi-gem"></i></div>
    <div class="erro-code">404</div>
    <p class="fs-5 mb-1">Página não encontrada</p>
    <p class="erro-msg mb-4">O endereço acessado não existe ou foi movido.</p>
    <a href="{% url 'dashboard:index' %}" class="btn btn-warning px-4">
      <i class="bi bi-speedometer2 me-2"></i>Voltar ao Dashboard
    </a>
  </div>
</body>
</html>
